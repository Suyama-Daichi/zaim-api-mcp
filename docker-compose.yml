services:
  zaim-api-mcp:
    build: .
    image: zaim-api-mcp
    container_name: zaim-api-mcp
    # 認証情報はシェルの環境変数、またはこのファイルと同じ場所の .env から読み込む
    environment:
      ZAIM_CONSUMER_KEY: ${ZAIM_CONSUMER_KEY}
      ZAIM_CONSUMER_SECRET: ${ZAIM_CONSUMER_SECRET}
      ZAIM_ACCESS_TOKEN: ${ZAIM_ACCESS_TOKEN}
      ZAIM_ACCESS_TOKEN_SECRET: ${ZAIM_ACCESS_TOKEN_SECRET}
    # MCP は標準入出力で通信するため stdin を開いておく（TTY は割り当てない）
    stdin_open: true
